<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Portails des Compteurs</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .menu-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background-color: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        /* Changement de couleur au survol selon le compteur */
        .menu-text {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .icon {
            font-size: 24px;
        }
        .elec:hover {
            border-color: #ffc107;
            background-color: #fff9e6;
            color: #b28600;
        }
        .gaz:hover {
            border-color: #fd7e14;
            background-color: #fff3cd;
            color: #ba5300;
        }
        .eau:hover {
            border-color: #007bff;
            background-color: #e6f2ff;
            color: #0056b3;
        }
        .arrow {
            font-size: 20px;
            transition: transform 0.2s;
        }
        .menu-card:hover .arrow {
            transform: translateX(5px);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gestion des Énergies</h1>
    <p class="subtitle">Sélectionnez le compteur à encoder :</p>
    
    <div class="menu-grid">
        <!-- Lien vers la page électricité (compteur.html) -->
        <a href="compteur.html" class="menu-card elec">
            <div class="menu-text">
                <span class="icon">⚡</span>
                <span>Compteur Électricité</span>
            </div>
            <span class="arrow">➔</span>
        </a>

        <!-- Lien vers la page gaz (simulation) -->
        <a href="gaz.html" class="menu-card gaz" onclick="alert('Page de simulation Gaz bientôt disponible !')">
            <div class="menu-text">
                <span class="icon">🔥</span>
                <span>Compteur Gaz</span>
            </div>
            <span class="arrow">➔</span>
        </a>

        <!-- Lien vers la page eau (simulation) -->
        <a href="#" class="menu-card eau" onclick="alert('Page de simulation Eau bientôt disponible !')">
            <div class="menu-text">
                <span class="icon">💧</span>
                <span>Compteur Eau</span>
            </div>
            <span class="arrow">➔</span>
        </a>
    </div>
</div>

</body>
</html>
