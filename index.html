<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Jeu de Piste QR Code</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; text-align: center; padding: 20px; margin: 0; }
        .card { background: white; max-width: 600px; margin: 40px auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 8px solid #2c3e50; }
        h1 { color: #2c3e50; font-size: 2.2rem; margin-bottom: 10px; }
        p.subtitle { font-size: 1.2rem; color: #666; margin-bottom: 30px; }
        
        /* Grille de boutons */
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        
        .btn { display: block; padding: 20px; font-size: 1.3rem; font-weight: bold; color: white; text-decoration: none; border-radius: 12px; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        
        /* Couleurs uniques pour chaque bouton */
        .btn-1 { background-color: #2ecc71; }
        .btn-2 { background-color: #3498db; }
        .btn-3 { background-color: #9b59b6; }
        .btn-4 { background-color: #e67e22; }
        
        .icon { font-size: 2rem; display: block; margin-bottom: 8px; }
        
        @media (max-width: 480px) {
            .grid-buttons { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📱 Grand Jeu de Piste EPN</h1>
        <p class="subtitle">Sélectionnez une étape ci-dessous pour accéder aux énigmes :</p>
        
        <div class="grid-buttons">
            <a href="./01.html" class="btn btn-1">
                <span class="icon">🖥️</span> Énigme 1<br><span style="font-size: 0.9rem; font-weight: normal;">L'Ordinateur</span>
            </a>
            <a href="./02.html" class="btn btn-2">
                <span class="icon">🖨️</span> Énigme 2<br><span style="font-size: 0.9rem; font-weight: normal;">L'Imprimante</span>
            </a>
            <a href="./03.html" class="btn btn-3">
                <span class="icon">🌐</span> Énigme 3<br><span style="font-size: 0.9rem; font-weight: normal;">L'Internet</span>
            </a>
            <a href="./04.html" class="btn btn-4">
                <span class="icon">🏆</span> Énigme 4<br><span style="font-size: 0.9rem; font-weight: normal;">Le Grand Final</span>
            </a>
            <a href="./piege.html" class="btn btn-4">
                <span class="icon">🏴‍☠</span> Énigme 4<br><span style="font-size: 0.9rem; font-weight: normal;">Le Grand Final</span>
            </a>
        </div>
    </div>
</body>
</html>
